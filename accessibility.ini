; Chords are Control + Alt + the virtual-key code below. Set 0 to disable.
[hotkeys]
test=112
repeat=113
stop=114
mute=116
dump=119
shutdown=0

; Prototype text narration. Existing installations default to both enabled.
[gameplay]
subtitles=1
tutorials=1
; 0 queues gameplay text without interrupting unrelated screen-reader speech.
interrupt=0
