name: Build and test mod
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned dependencies
        shell: pwsh
        run: ./bootstrap.ps1
      - name: Build and run synthetic tests
        shell: pwsh
        run: ./build.ps1 -Test
      - name: Verify lock trace analysis
        shell: pwsh
        run: python tests/lock_trace_analysis_test.py
