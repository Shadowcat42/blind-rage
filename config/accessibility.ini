; Shortcuts use key names, for example Ctrl+Alt+F9 or Ctrl+Shift+Numpad5.
; Modifiers: Ctrl, Alt, Shift, Win. Keys: A-Z, 0-9, F1-F24, Numpad0-9, and names
; such as Space, Enter, PageUp, Home, Slash or Backtick. Set None to disable.
; A key without modifiers is taken from the game while it has focus.
[hotkeys]
; Repeat the current menu item, cue or latest announcement.
repeat=Backtick
; Turn narration on or off.
mute=Ctrl+Alt+F5
; Save a local diagnostic dump (see the README before sharing one).
dump=F5
; Read Health/Burst status (Back/Select also does this during gameplay).
status=H
; Shooting assistance: cycle the mode, previous/next target cluster, and switch
; melee aim priority. Keyboard equivalents of D-pad Up, Left, Right and Down. In
; melee outside rapid fire, D-pad Up and aimmode toggle the melee beacon.
aimmode=M
aimprev=Comma
aimnext=Period
aimpriority=Slash
; Open the spoken settings menu (both stick clicks on a controller also open it).
settings=Ctrl+O
; Keyboard right stick: held in gameplay (camera, lock-on target switching); in
; Episode records and Control Settings they browse like the right stick.
rsup=Ctrl+Up
rsdown=Ctrl+Down
rsleft=Ctrl+Left
rsright=Ctrl+Right

; Text narration.
[gameplay]
subtitles=1
tutorials=1
; 0 queues gameplay text without interrupting unrelated screen-reader speech.
interrupt=0
; Health/Burst warnings use queued speech; percentages update without chatter.
status_warnings=1
low_health_percent=25
qtes=1
; Urgent new QTE instructions may interrupt NVDA; disappearance never stops it.
qte_interrupt=1
; Shooting assistance, for rail shooting and melee rapid fire. off: no beacon.
; beacons: audio guidance. boosted: beacons plus a larger native lock cone (rail)
; or homing angle (melee). In every mode, holding L1 steers the cursor onto
; targets; moving the stick takes over.
shooting_mode=beacons
; Boosted cone multipliers of the game's own lock-on limits, 1-10. In Episode 1
; the game allows 50 degrees at point blank and 3.6 degrees at maximum range;
; boost_point_blank scales the near limit, boost_max_range the far limit.
boost_point_blank=2
boost_max_range=3
; Boosted melee rapid fire: multiplier of the game's homing angle (2.6 degrees),
; 1-10.
boost_homing=3
; Melee rapid fire guides and tracks this kind first: projectiles or enemies.
; D-pad Down switches it during rapid fire.
aim_priority=projectiles
; The mod's own tutorial boxes, which pause the game like the game's tutorials:
; rail shooting in Episode 1, melee in Episode 2 and the chase in Episode 8. Set 0
; to skip them, for example on replays.
mod_tutorials=1
; Walking guidance in melee sections: a steady beacon toward the nearest trigger
; area not yet entered (a sine tone, 525 Hz ahead, 440 Hz behind), quiet during
; fights.
walk_beacon=1
; Melee beacon, outside rapid fire: points to the enemy your attacks will turn
; to, steady once it is in reach; otherwise to the nearest enemy, pulsing faster
; as you close in. D-pad Up (or the aimmode key) toggles it in melee.
melee_beacon=1
; Look-around beacon, in scenes where the right stick turns the camera (Episode
; 10's hot spring): leads the view to the things the game reacts to, steady once
; the view is on one, then moves on to the next.
look_beacon=1
; Tracking steering speed as a share of the game's own cursor speed, 0-100.
tracking_strength=100
; Loudness of the mod's sounds (shooting beacon, synchronic count-in), 0-100.
audio_cue_volume=60
; Each cue's share of that volume, 0-100 percent: the shooting, walking, melee
; and look-around beacons, Episode 8's fire warning and the Synchronic count-in.
shooting_beacon_volume=100
walk_beacon_volume=100
melee_beacon_volume=100
look_beacon_volume=100
fire_warning_volume=100
count_in_volume=100

; BlindRage.exe itself.
[launcher]
; Check for a newer Blind Rage release on launch and offer to install it. Set 0
; to stop checking. Your settings are kept when updating.
update_check=1
