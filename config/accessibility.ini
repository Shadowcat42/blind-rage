; Shortcuts use key names, for example Ctrl+Alt+F9 or Ctrl+Shift+Numpad5.
; Modifiers: Ctrl, Alt, Shift, Win. Keys: A-Z, 0-9, F1-F24, Numpad0-9, and names
; such as Space, Enter, PageUp, Home, Slash or Backtick. Set None to disable.
; A key without modifiers is taken from the game while it has focus.
[hotkeys]
test=Ctrl+Alt+F1
repeat=Ctrl+Alt+F2
stop=Ctrl+Alt+F3
mute=Ctrl+Alt+F5
dump=Ctrl+Alt+F8
shutdown=None
status=Ctrl+Alt+F4
aimmode=Ctrl+Alt+F9
aimprev=Ctrl+Alt+F10
aimnext=Ctrl+Alt+F12

; Prototype text narration. Existing installations default to both enabled.
[gameplay]
subtitles=1
tutorials=1
; 0 queues gameplay text without interrupting unrelated screen-reader speech.
interrupt=0
; Health/Burst warnings use queued speech; percentages update without chatter.
status_warnings=1
; Back/Select reads status during gameplay and keeps its cinematic-skip action.
status_button=1
low_health_percent=25
qtes=1
; Urgent new QTE instructions may interrupt NVDA; disappearance never stops it.
qte_interrupt=1
; Rail shooting assistance. off: none. beacons: audio guidance only. boosted:
; beacons plus a larger native lock cone. tracking: beacons, and holding L1 steers
; the cursor onto unlocked targets (moving the stick takes over).
shooting_mode=beacons
; Boosted cone multipliers of the game's own limits, 1-10: point blank scales the
; near limit, max range the far limit.
boost_point_blank=2
boost_max_range=3
; Tracking steering speed as a share of the game's own cursor speed, 0-100.
tracking_strength=100
beacon_volume=30
