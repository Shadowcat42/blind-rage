; Shortcuts use key names, for example Ctrl+Alt+F9 or Ctrl+Shift+Numpad5.
; Modifiers: Ctrl, Alt, Shift, Win. Keys: A-Z, 0-9, F1-F24, Numpad0-9, and names
; such as Space, Enter, PageUp, Home, Slash or Backtick. Set None to disable.
; A key without modifiers is taken from the game while it has focus.
[hotkeys]
; Repeat the current menu item, cue or latest announcement.
repeat=Backtick
; Turn narration on or off.
mute=Ctrl+Alt+F5
; Save a local diagnostic dump (see the README before sharing one).
dump=F5
; Read Health/Burst status (Back/Select also does this during gameplay).
status=H
; Shooting assistance: cycle the mode, previous/next target cluster, and switch
; melee aim priority. Keyboard equivalents of D-pad Up, Left, Right and Down. In
; melee outside rapid fire, D-pad Up and aimmode toggle the melee beacon.
aimmode=M
aimprev=Comma
aimnext=Period
aimpriority=Slash
; Open the spoken settings menu (both stick clicks on a controller also open it).
settings=Ctrl+O
; Keyboard right stick: held in gameplay (camera, lock-on target switching); in
; Episode records and Control Settings they browse like the right stick.
rsup=Ctrl+Up
rsdown=Ctrl+Down
rsleft=Ctrl+Left
rsright=Ctrl+Right

; The settings below are also in the spoken settings menu (Ctrl+O), grouped the
; same way. Changes made there apply at once; edits here need a game restart.
[gameplay]

; --- Speech ---
; Subtitles: reads subtitles. 1 on, 0 off.
subtitles=1
; Game tutorials: reads the game's own tutorial boxes. 1 on, 0 off.
tutorials=1
; Game text interrupts speech: new subtitles and tutorials cut off whatever the
; screen reader is saying, instead of waiting. 1 on, 0 off.
interrupt=0
; QTE announcements: announces quick-time events. 1 on, 0 off.
qtes=1
; QTEs interrupt speech: a new QTE prompt cuts off whatever the screen reader is
; saying. 1 on, 0 off.
qte_interrupt=1
; QTE wording: quick says prompts briefly ("LS right RS left", "Mash L2 R2");
; verbose spells them out ("Left stick right and right stick left together.").
qte_wording=verbose
; Gauge alerts: announces low health, when Burst is ready, and other changes to
; your gauges. 1 on, 0 off.
status_warnings=1
; Low health at: the health percentage that counts as low health in gauge
; alerts, 5-50.
low_health_percent=25

; --- Tutorials and tips ---
; Tutorials: the mod's own tutorial boxes. They pause the game. 1 on, 0 off.
mod_tutorials=1
; Fight tips: a short pausing box when an enemy whose fight isn't obvious
; appears. 1 on, 0 off.
mod_tips=1

; --- Shooting and aiming ---
; Shooting assistance: off, beacons (audio beacons toward targets) or boosted
; (beacons with a larger lock-on area). In every mode, holding L1 steers your
; aim onto targets; moving the stick takes over. D-pad Up (or the aimmode key)
; cycles it during shooting.
shooting_mode=beacons
; Melee rapid fire aims at: projectiles or enemies first. D-pad Down (or the
; aimpriority key) switches it during rapid fire.
aim_priority=projectiles
; L1 steering speed: how fast holding L1 steers your aim onto targets, as a
; percentage of the game's own cursor speed, 0-100.
tracking_strength=100

; --- Beacons ---
; Walking beacon: a tone toward where to go next when walking. Quiet during
; fights. 1 on, 0 off.
walk_beacon=1
; Melee beacon: a tone toward the enemy your attacks will turn to. D-pad Up (or
; the aimmode key) toggles it in melee. 1 on, 0 off.
melee_beacon=1
; Look-around beacon: in scenes where the right stick turns the camera, leads
; your view to things the game reacts to. 1 on, 0 off.
look_beacon=1

; --- Gameplay assists ---
; QTE freeze: pauses the game briefly when a new QTE appears, so you hear it
; sooner. Presses during the freeze don't count, and game sound cuts out for a
; moment. Milliseconds, 0-300 in steps of 50; 0 is off. Synchronic QTEs never
; freeze.
qte_freeze=0
; Boosted lock-on, close range and long range: how much larger the lock-on area
; is up close and far away, as multiples of the game's own limits, 1-10. Only
; with boosted shooting assistance.
boost_point_blank=2
boost_max_range=3
; Boosted rapid fire homing: how much more melee rapid fire homes in, as a
; multiple of the game's own homing, 1-10. Only with boosted shooting
; assistance.
boost_homing=3

; --- Volume ---
; Sound cue volume: overall volume of the mod's sounds, 0-100.
audio_cue_volume=60
; Each sound's share of that volume, 0-100 percent: the shooting, walking, melee
; and look-around beacons, the mod's danger warnings (such as when to jump) and
; the count-in beats before a Synchronic QTE.
shooting_beacon_volume=100
walk_beacon_volume=100
melee_beacon_volume=100
look_beacon_volume=100
fire_warning_volume=100
count_in_volume=100

; BlindRage.exe itself.
[launcher]
; Check for a newer Blind Rage release on launch and offer to install it. Set 0
; to stop checking. Your settings are kept when updating.
update_check=1
